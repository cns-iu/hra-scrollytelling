  maintained page carries this block verbatim.

  {{root}} stands for the page's path back to the repository root: empty
  on index.html, ../../ on story/N/index.html.

  Normalised before comparison: whitespace, and the aria-current="page"
  marker on the active navigation item.
-->
<footer class="site-footer site-chrome">

        <a
